name: C++ Tests

on:
  push:
    branches:
      - main   # או כל סניף אחר
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y g++

    - name: Compile tests
      run: g++ -std=c++17 tests/test_patient.cpp HospitalManage/Patient.cpp -I. -o runTests

    - name: Run tests
      run: ./runTests
